<!doctype html>
<meta charset="utf-8">
<title>Module Harness</title>
<style>html,body{margin:0;height:100%;background:#d9d9d6;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
<canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
// Usage: harness.html?m=flx10&cam=x,y,z&tgt=x,y,z&fov=30&floor=0
// m = module name in js/ exporting build(THREE) -> { group, info }. Units mm, y up, +z towards the DJ, +x to the DJ's right.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { makeRenderer, makeStudio } from './js/env.js';
const q = new URLSearchParams(location.search);
const v = (s, d) => (q.get(s) ? q.get(s).split(',').map(Number) : d);
const canvas = document.getElementById('c');
const renderer = makeRenderer(canvas, { preserve: true });
const scene = new THREE.Scene();
const studio = makeStudio(renderer, scene, { bg: q.get('bg') ? parseInt(q.get('bg'), 16) : 0xd9d9d6 });
const mod = await import('./js/' + (q.get('m') || 'flx10') + '.js?v=' + Date.now());
const { group, info } = await mod.build(THREE, {});
const lift = +(q.get('y') || 0); group.position.y = lift;
if (q.get('floor') === '0') studio.floor.visible = false;
scene.add(group);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 30), 1, 5, 40000);
cam.position.fromArray(v('cam', [700, 700, 900]));
const controls = new OrbitControls(cam, canvas);
controls.target.fromArray(v('tgt', [0, 30, 0])); controls.update();
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let frames = 0;
renderer.setAnimationLoop((t) => { mod.tick && mod.tick(t / 1000, group); controls.update(); renderer.render(scene, cam); if (++frames === 30) document.title = 'READY'; });
window.__info = info; window.__cam = cam; window.__controls = controls;
</script>
